<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">从标注图片到训练标签</title>
  <desc id="desc">展示目标检测数据从图片标注、VOC XML、坐标转换到两种 TXT 标签格式的流程。</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; rx: 18; }
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .label { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #0f172a; }
      .text { font: 500 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #334155; }
      .code { font: 600 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #1e293b; }
      .hint { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .arrow { stroke: #2563eb; stroke-width: 4; fill: none; marker-end: url(#arrowHead); }
      .thin { stroke: #94a3b8; stroke-width: 2; fill: none; }
      .accent-blue { fill: #dbeafe; stroke: #2563eb; stroke-width: 2; }
      .accent-green { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .accent-yellow { fill: #fef9c3; stroke: #ca8a04; stroke-width: 2; }
      .accent-red { fill: #fee2e2; stroke: #dc2626; stroke-width: 2; }
      .screen { fill: #e2e8f0; stroke: #64748b; stroke-width: 2; }
      .box-red { fill: none; stroke: #ef4444; stroke-width: 5; }
      .box-blue { fill: none; stroke: #3b82f6; stroke-width: 5; }
    </style>
    <marker id="arrowHead" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M 0 0 L 14 7 L 0 14 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="620"/>
  <text class="title" x="70" y="62">从图片标注到训练标签：先分清两种 TXT</text>

  <rect class="panel" x="60" y="105" width="270" height="410" rx="18"/>
  <text class="label" x="90" y="150">1. 图片标注</text>
  <rect class="screen" x="88" y="182" width="214" height="150" rx="10"/>
  <rect x="105" y="198" width="180" height="118" rx="8" fill="#bfdbfe"/>
  <circle cx="150" cy="235" r="24" fill="#60a5fa"/>
  <rect x="198" y="250" width="52" height="34" rx="6" fill="#f59e0b"/>
  <rect class="box-red" x="126" y="210" width="62" height="58" rx="3"/>
  <rect class="box-blue" x="190" y="238" width="78" height="58" rx="3"/>
  <text class="hint" x="96" y="366">LabelImg 画框</text>
  <text class="hint" x="96" y="396">得到类别 + 矩形框</text>

  <path class="arrow" d="M 340 310 L 410 310"/>

  <rect class="panel" x="420" y="105" width="270" height="410" rx="18"/>
  <text class="label" x="450" y="150">2. VOC XML</text>
  <rect class="accent-blue" x="450" y="184" width="210" height="190" rx="12"/>
  <text class="code" x="475" y="225">&lt;object&gt;</text>
  <text class="code" x="492" y="260">name: tank</text>
  <text class="code" x="492" y="295">xmin, ymin</text>
  <text class="code" x="492" y="330">xmax, ymax</text>
  <text class="code" x="475" y="365">&lt;/object&gt;</text>
  <text class="hint" x="450" y="410">原始框是像素坐标</text>
  <text class="hint" x="450" y="440">还不能直接训练 YOLO</text>

  <path class="arrow" d="M 700 310 L 770 310"/>

  <rect class="panel" x="780" y="105" width="270" height="410" rx="18"/>
  <text class="label" x="810" y="150">3. 坐标转换</text>
  <rect class="accent-yellow" x="810" y="186" width="210" height="208" rx="12"/>
  <text class="code" x="830" y="230">cx = (xmin+xmax)/2/W</text>
  <text class="code" x="830" y="270">cy = (ymin+ymax)/2/H</text>
  <text class="code" x="830" y="310">w  = (xmax-xmin)/W</text>
  <text class="code" x="830" y="350">h  = (ymax-ymin)/H</text>
  <text class="hint" x="810" y="428">变成中心点 + 宽高</text>
  <text class="hint" x="810" y="458">并归一化到 0-1</text>

  <path class="arrow" d="M 1060 310 L 1130 310"/>

  <rect class="panel" x="1140" y="105" width="210" height="410" rx="18"/>
  <text class="label" x="1168" y="150">4. 两种输出</text>
  <rect class="accent-green" x="1162" y="182" width="166" height="118" rx="12"/>
  <text class="text" x="1184" y="218">Ultralytics</text>
  <text class="code" x="1182" y="254">class_id</text>
  <text class="code" x="1182" y="282">cx cy w h</text>
  <rect class="accent-red" x="1162" y="332" width="166" height="128" rx="12"/>
  <text class="text" x="1184" y="368">custom.py</text>
  <text class="code" x="1182" y="404">cx cy w h</text>
  <text class="code" x="1182" y="432">one-hot</text>

  <path class="thin" d="M 1162 307 L 1328 307"/>
  <text class="hint" x="1175" y="498">TXT 名字相似</text>
  <text class="hint" x="1175" y="524">格式不能混用</text>
</svg>
